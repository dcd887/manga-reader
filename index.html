<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>漫览 · 开源漫画阅读器</title>
<style>
:root{
  --bg:#f5f1ea; --card:#fff; --ink:#2b2b2b; --sub:#8a8378; --accent:#c25e4a;
  --line:#e8e2d8; --reader-bg:#171717;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.logo{font-size:21px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.logo em{color:var(--accent);font-style:normal}
.search{flex:1;min-width:200px;display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.search input{flex:1;border:none;outline:none;padding:9px 16px;font-size:15px;background:transparent}
.search button{border:none;background:var(--accent);color:#fff;padding:0 20px;font-size:14px;cursor:pointer;font-weight:600}
.lang{display:flex;gap:6px}
.lang button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--sub)}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.hero{text-align:center;padding:34px 0 24px}
.hero h1{font-size:25px;font-weight:800}
.hero p{color:var(--sub);margin-top:8px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.cover{position:relative;aspect-ratio:3/4;background:#e8e2d8;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px;max-width:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{padding:10px 12px}
.info h3{font-size:14px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.info .meta{font-size:12px;color:var(--sub);margin-top:4px}
.empty{padding:60px 0;text-align:center;color:var(--sub)}
.hidden{display:none!important}
/* 详情 */
.detail-top{display:flex;gap:20px;margin-bottom:22px}
.detail-cover{width:190px;flex-shrink:0;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.detail-cover img{width:100%;display:block}
.detail-info{flex:1;min-width:0}
.detail-info h2{font-size:22px;font-weight:800;line-height:1.3}
.detail-info .author{color:var(--sub);font-size:14px;margin:8px 0 12px}
.detail-info .desc{font-size:14px;line-height:1.7;color:#555;max-height:130px;overflow-y:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--sub)}
.chap-list{display:flex;flex-direction:column}
.chap{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;cursor:pointer;transition:background .12s}
.chap:hover{background:#faf6f0}
.chap .t{font-size:14px;font-weight:600}
.chap .t small{color:var(--sub);font-weight:400;margin-left:8px}
.chap .go{color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap}
.chap.continue{border-color:var(--accent);background:#fdf6f2}
.chap .resume{font-size:11px;color:var(--accent);margin-left:8px;font-weight:400}
/* 阅读器 */
.reader{position:fixed;inset:0;background:var(--reader-bg);z-index:100;display:flex;flex-direction:column}
.reader-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#202020;color:#ddd}
.reader-top .back{cursor:pointer;font-size:17px;padding:4px 10px;border-radius:8px;white-space:nowrap}
.reader-top .back:hover{background:#333}
.reader-top .ct{flex:1;text-align:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-top .ind{font-size:13px;color:#999;white-space:nowrap}
.reader-body{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
.reader-body .pageimg{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;margin:12px auto;border-radius:4px}
.navzone{position:absolute;top:0;bottom:0;width:45%;background:transparent;border:none;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;color:#888;font-size:30px;opacity:0;transition:opacity .2s}
.navzone:hover{opacity:.5}
#navL{left:0}#navR{right:0}
.reader-bottom{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px;background:#202020;color:#ccc;font-size:13px}
.reader-bottom button{background:#333;color:#ddd;border:none;border-radius:8px;padding:8px 20px;cursor:pointer;font-size:13px}
.reader-bottom button:hover{background:#444}
.reader-bottom button:disabled{opacity:.35;cursor:default}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.cfg{max-width:980px;margin:0 auto;padding:0 16px}
.cfg-inner{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:6px}
.cfg-hint{font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:10px}
.cfg-row{display:flex;gap:8px}
.cfg-row input{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;outline:none;background:#faf8f4}
.cfg-row input:focus{border-color:var(--accent)}
.cfg-row button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 18px;font-size:13px;font-weight:600;cursor:pointer}
@media(max-width:680px){
  .lang{width:100%;justify-content:flex-end}
  .detail-top{flex-direction:row}
  .detail-cover{width:130px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">漫<em>览</em></div>
    <div class="search">
      <input id="q" placeholder="搜索漫画，支持中文 / 日文 / 英文原名" autocomplete="off">
      <button id="doSearch">搜索</button>
    </div>
    <div class="lang">
      <button data-lang="zh" class="on">中文</button>
      <button data-lang="en">英文</button>
      <button data-lang="">全部</button>
      <button id="cfgBtn" title="图源代理设置">⚙</button>
    </div>
  </div>
</header>
<div class="cfg hidden" id="cfgPanel">
  <div class="cfg-inner">
    <div style="font-weight:700;margin-bottom:8px">图源代理设置</div>
    <div class="cfg-hint">默认直连 MangaDex 官方图源，本机打开即可用；<br>部署到 GitHub Pages 或手机访问时需填代理地址（免费 Cloudflare Worker）。</div>
    <div class="cfg-row">
      <input id="proxyUrl" placeholder="https://你的代理名.workers.dev" autocomplete="off">
      <button id="saveProxy">保存</button>
    </div>
    <button id="clearProxy" style="margin-top:8px;background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;text-decoration:underline">恢复直连（清除代理）</button>
  </div>
</div>

<main>
  <div id="home">
    <div class="hero">
      <h1>随时随地，打开就看</h1>
      <p>开源图源（MangaDex）· 支持中文 / 英文 / 日文漫画 · 自动记住阅读进度</p>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <div id="detail" class="hidden">
    <div class="detail-top">
      <div class="detail-cover"><img id="dCover" alt=""></div>
      <div class="detail-info">
        <h2 id="dTitle"></h2>
        <div class="author" id="dAuthor"></div>
        <div class="chips" id="dChips"></div>
        <div class="desc" id="dDesc"></div>
      </div>
    </div>
    <div id="dChapters" class="chap-list"></div>
    <div id="dEmpty" class="empty hidden">暂无可读章节</div>
  </div>

  <div id="loading" class="empty hidden">加载中…</div>
</main>

<div id="reader" class="reader hidden">
  <div class="reader-top">
    <div class="back" id="rBack">‹ 返回</div>
    <div class="ct" id="rTitle"></div>
    <div class="ind" id="rInd"></div>
  </div>
  <div class="reader-body" id="rBody">
    <button class="navzone" id="navL">‹</button>
    <button class="navzone" id="navR">›</button>
  </div>
  <div class="reader-bottom">
    <button id="rPrev">上一页</button>
    <span id="rPos">1 / 1</span>
    <button id="rNext">下一页</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const API = "https://api.mangadex.org";
const PROXY_KEY = "mangaReaderProxy_v1";
const $ = s => document.querySelector(s);
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }
function getProxy(){ try{ return localStorage.getItem(PROXY_KEY)||""; }catch(e){ return ""; } }

let lang = "zh";
const LANG_NAME = {zh:"中文","zh-hk":"繁中",en:"英文",ja:"日文",ko:"韩文"};
const progKey = "mangaReaderProgress_v1";

/* ---------- 工具 ---------- */
async function api(path, params){
  const u = new URL(API + path);
  if(params){
    for(const [k,v] of Object.entries(params)){
      if(v===undefined||v===null) continue;
      if(Array.isArray(v)) v.forEach(x=>u.searchParams.append(k+"[]", x));
      else if(typeof v === "object") for(const [kk,vv] of Object.entries(v)) u.searchParams.append(k+"["+kk+"]", vv);
      else u.searchParams.append(k, v);
    }
  }
  const proxy = getProxy();
  const url = proxy ? proxy + "/" + u.toString() : u.toString();
  const r = await fetch(url, {headers:{"User-Agent":"MangaLane/1.0 (browser reader)"}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function titleOf(t){
  return t.zh || t["zh-hk"] || t.ja || t.en || t.ko || Object.values(t)[0] || "未知标题";
}
function coverUrl(m){
  const rel = (m.relationships||[]).find(x=>x.type==="cover_art");
  if(!rel || !rel.attributes || !rel.attributes.fileName) return "";
  return "https://uploads.mangadex.org/covers/"+m.id+"/"+rel.attributes.fileName+".256.jpg";
}
const langOpts = () => lang ? [lang] : ["zh","zh-hk","en","ja","ko"];
function getProgress(mid){ try{ return (JSON.parse(localStorage.getItem(progKey))||{})[mid]; }catch(e){ return undefined; } }
function saveProgress(mid, chId, label, page){
  try{
    const all = JSON.parse(localStorage.getItem(progKey))||{};
    all[mid] = {chId, label, page, t:Date.now()};
    localStorage.setItem(progKey, JSON.stringify(all));
  }catch(e){}
}

/* ---------- 主页 / 搜索 ---------- */
async function loadHome(){
  $("#grid").innerHTML = "";
  $("#loading").classList.remove("hidden");
  try{
    const d = await api("/manga", {
      includes:["cover_art"], availableTranslatedLanguage:langOpts(),
      order:{latestUploadedChapter:"desc"}, limit:24
    });
    renderGrid(d.data);
  }catch(e){ $("#grid").innerHTML = '<div class="empty">加载失败：'+e.message+'（请检查网络后重试）</div>'; }
  $("#loading").classList.add("hidden");
}
async function doSearch(){
  const q = $("#q").value.trim();
  $("#home").classList.remove("hidden"); $("#detail").classList.add("hidden");
  $("#grid").innerHTML = "";
  $("#loading").classList.remove("hidden");
  try{
    const params = {includes:["cover_art"], availableTranslatedLanguage:langOpts(), limit:30};
    if(q) params.title = q;
    else params.order = {latestUploadedChapter:"desc"};
    const d = await api("/manga", params);
    if(!d.data.length) $("#grid").innerHTML = '<div class="empty">没找到相关漫画，试试用日文 / 英文原名搜索</div>';
    else renderGrid(d.data);
  }catch(e){ $("#grid").innerHTML = '<div class="empty">搜索失败：'+e.message+'</div>'; }
  $("#loading").classList.add("hidden");
}
function renderGrid(list){
  const g = $("#grid"); g.innerHTML = "";
  list.forEach(m=>{
    const t = titleOf(m.attributes.title);
    const c = coverUrl(m);
    const lastCh = m.attributes.lastChapter ? "第"+m.attributes.lastChapter+"话" : "连载中";
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<div class="cover"><img loading="lazy" src="'+(c||"")+'" onerror="this.style.display=\'none\'"><span class="tag">'+t+'</span></div><div class="info"><h3>'+t+'</h3><div class="meta">'+lastCh+'</div></div>';
    card.onclick = ()=>openDetail(m.id);
    g.appendChild(card);
  });
}

/* ---------- 详情 ---------- */
let curManga = null, curMangaId = null;
async function openDetail(id){
  $("#loading").classList.remove("hidden");
  try{
    const d = await api("/manga/"+id, {includes:["cover_art","author","artist"]});
    curManga = d.data; curMangaId = id;
    $("#home").classList.add("hidden"); $("#detail").classList.remove("hidden");
    const a = curManga.attributes;
    $("#dCover").src = coverUrl(curManga);
    $("#dTitle").textContent = titleOf(a.title);
    const authors = (curManga.relationships||[]).filter(r=>r.type==="author"||r.type==="artist")
      .map(r=>r.attributes?r.attributes.name:"").filter(Boolean);
    $("#dAuthor").textContent = (authors.length? "作者："+authors.join(" / ") : "") + "　·　更新至 " + (a.lastChapter||"?") + " 话";
    $("#dDesc").textContent = (a.description && a.description.zh) || (a.description && a.description.en) || "暂无简介";
    $("#dChips").innerHTML = ['<span class="chip">'+((a.year||"")+" 年")+'</span>','<span class="chip">'+(a.status==="ongoing"?"连载中":a.status==="completed"?"已完结":"状态未知")+'</span>'].join("");
    await loadChapters(id);
  }catch(e){ toast("加载详情失败："+e.message); }
  $("#loading").classList.add("hidden");
}
async function loadChapters(id){
  const feed = await api("/manga/"+id+"/feed", {
    translatedLanguage:langOpts(), "order[chapter]":"asc", limit:500
  });
  const wrap = $("#dChapters"); wrap.innerHTML = "";
  const prog = getProgress(id);
  feed.data.forEach(ch=>{
    const at = ch.attributes;
    const langName = LANG_NAME[at.translatedLanguage] || at.translatedLanguage;
    const label = (at.chapter? "第"+at.chapter+"话" : "番外") + (at.title? " · "+at.title : "");
    const item = document.createElement("div");
    item.className = "chap" + (prog && prog.chId===ch.id ? " continue" : "");
    item.innerHTML = '<div class="t">'+label+'<small>'+langName+'</small>'+(prog&&prog.chId===ch.id?'<span class="resume">▶ 继续阅读</span>':'')+'</div><div class="go">阅读 ›</div>';
    item.onclick = ()=>openReader(id, ch.id, label);
    wrap.appendChild(item);
  });
  if(!feed.data.length) $("#dEmpty").classList.remove("hidden"); else $("#dEmpty").classList.add("hidden");
}

/* ---------- 阅读器 ---------- */
let rMangaId=null, rChId=null, rLabel="", rPages=[], rIdx=0;
async function openReader(mid, chid, label){
  rMangaId=mid; rChId=chid; rLabel=label;
  $("#reader").classList.remove("hidden");
  $("#rTitle").textContent = (curManga? titleOf(curManga.attributes.title) : "") + " · " + label;
  $("#rBody").innerHTML = '<div class="empty" style="color:#888">加载章节…</div>';
  try{
    const at = await api("/at-home/server/"+chid);
    const hash = at.chapter.hash;
    rPages = at.chapter.data.map(p=>at.baseUrl+"/data/"+hash+"/"+p);
    if(!rPages.length) throw new Error("该章节暂无图片");
    const p = getProgress(mid);
    rIdx = (p && p.chId===chid) ? Math.min(p.page||0, rPages.length-1) : 0;
    renderPage();
  }catch(e){
    $("#rBody").innerHTML = '<div class="empty" style="color:#888">章节加载失败：'+e.message+'</div>';
  }
}
function renderPage(){
  const body = $("#rBody");
  body.innerHTML = "";
  const img = document.createElement("img");
  img.className = "pageimg"; img.src = rPages[rIdx]; img.alt = "第"+(rIdx+1)+"页";
  body.appendChild(img);
  $("#rPos").textContent = (rIdx+1)+" / "+rPages.length;
  $("#rInd").textContent = (rIdx+1)+"/"+rPages.length;
  $("#rPrev").disabled = rIdx===0;
  $("#rNext").disabled = rIdx>=rPages.length-1;
  saveProgress(rMangaId, rChId, rLabel, rIdx);
}
function rNext(){ if(rIdx<rPages.length-1){ rIdx++; renderPage(); } else toast("已经是最后一页"); }
function rPrev(){ if(rIdx>0){ rIdx--; renderPage(); } else toast("已经是第一页"); }
function closeReader(){
  $("#reader").classList.add("hidden");
  if(curMangaId){ loadChapters(curMangaId).catch(()=>{}); } // 刷新继续阅读标记
}

/* ---------- 事件 ---------- */
$("#doSearch").onclick = doSearch;
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });
document.querySelectorAll(".lang button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".lang button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); lang = b.dataset.lang;
    doSearch();
  };
});
$("#rBack").onclick = closeReader;
$("#rNext").onclick = rNext;
$("#rPrev").onclick = rPrev;
$("#navL").onclick = rPrev;
$("#navR").onclick = rNext;

/* 代理设置面板 */
$("#cfgBtn").onclick = ()=>{
  const p = $("#cfgPanel");
  p.classList.toggle("hidden");
  if(!p.classList.contains("hidden")) $("#proxyUrl").value = getProxy();
};
$("#saveProxy").onclick = ()=>{
  const v = $("#proxyUrl").value.trim().replace(/\/+$/,"");
  try{ localStorage.setItem(PROXY_KEY, v); }catch(e){}
  $("#cfgPanel").classList.add("hidden");
  toast(v ? "代理已设置："+v : "已清除代理");
  loadHome();
};
$("#clearProxy").onclick = ()=>{
  try{ localStorage.removeItem(PROXY_KEY); }catch(e){}
  $("#proxyUrl").value = "";
  $("#cfgPanel").classList.add("hidden");
  toast("已恢复直连");
  loadHome();
};
document.addEventListener("keydown", e=>{
  if($("#reader").classList.contains("hidden")) return;
  if(e.key==="ArrowRight"||e.key==="PageDown") rNext();
  else if(e.key==="ArrowLeft"||e.key==="PageUp") rPrev();
  else if(e.key==="Escape") closeReader();
});
// 移动端滑动翻页
let tx=0, ty=0;
document.addEventListener("touchstart", e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e=>{
  if($("#reader").classList.contains("hidden")) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){ dx<0 ? rNext() : rPrev(); }
}, {passive:true});

/* 启动 */
loadHome();
</script>
</body>
</html>
